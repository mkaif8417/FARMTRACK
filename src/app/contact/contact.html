<div class="contact-page">
  <div class="contact-hero">
    <h1>📞 Contact Us</h1>
    <p>We'd love to hear from you!</p>
  </div>

  <div class="contact-container">
    <div class="contact-info">
      <h2>Get In Touch</h2>
      <div class="info-item">
        <span>📧</span>
        <div>
          <h4>Email</h4>
          <p>support@farmtrack.com</p>
        </div>
      </div>
      <div class="info-item">
        <span>📱</span>
        <div>
          <h4>Phone</h4>
          <p>+91 98765 43210</p>
        </div>
      </div>
      <div class="info-item">
        <span>📍</span>
        <div>
          <h4>Address</h4>
          <p>Bengaluru, Karnataka, India</p>
        </div>
      </div>
      <div class="info-item">
        <span>🕐</span>
        <div>
          <h4>Working Hours</h4>
          <p>Mon - Sat: 9AM to 6PM</p>
        </div>
      </div>
    </div>

    <div class="contact-form">
      <h2>Send a Message</h2>
      <div class="form-group">
        <label>Your Name</label>
        <input [(ngModel)]="name" placeholder="Enter your name" />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input [(ngModel)]="email" placeholder="Enter your email" />
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input [(ngModel)]="subject" placeholder="Enter subject" />
      </div>
      <div class="form-group">
        <label>Message</label>
        <textarea [(ngModel)]="message" placeholder="Write your message..." rows="5"></textarea>
      </div>
      <button class="btn-submit" (click)="sendMessage()">
        📤 Send Message
      </button>
      <p class="success-msg" *ngIf="submitted">
        ✅ Message sent successfully! We will get back to you soon.
      </p>
    </div>
  </div>
</div>
